name: Add or Update Event

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      event_id:
        description: 'Event ID, only to edit an existing event (see List Events). Leave blank to add. When set, blank fields below keep their current value.'
        required: false
      name:
        description: 'Event name (needed when adding)'
        required: false
      description:
        description: 'Short description'
        required: false
      start_date:
        description: 'Start date (DD-MM-YYYY) (needed when adding)'
        required: false
      start_time:
        description: 'Start time, 24h (HH:MM) (needed when adding)'
        required: false
      end_date:
        description: 'End date (DD-MM-YYYY), leave blank to match start date'
        required: false
      end_time:
        description: 'End time, 24h (HH:MM). Leave blank to match start time.'
        required: false
      location:
        description: 'Location name (needed when adding)'
        required: false
      facebook_url:
        description: 'Facebook event URL (needed when adding)'
        required: false
      attending_count:
        description: 'Attending count (blank is 0 when adding)'
        required: false
      interested_count:
        description: 'Interested count (blank is 0 when adding)'
        required: false

jobs:
  add-event:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: node scripts/add-event.js
        env:
          EVENT_ID: ${{ inputs.event_id }}
          EVENT_NAME: ${{ inputs.name }}
          EVENT_DESCRIPTION: ${{ inputs.description }}
          EVENT_START_DATE: ${{ inputs.start_date }}
          EVENT_START_TIME: ${{ inputs.start_time }}
          EVENT_END_DATE: ${{ inputs.end_date }}
          EVENT_END_TIME: ${{ inputs.end_time }}
          EVENT_LOCATION: ${{ inputs.location }}
          EVENT_FACEBOOK_URL: ${{ inputs.facebook_url }}
          EVENT_ATTENDING_COUNT: ${{ inputs.attending_count }}
          EVENT_INTERESTED_COUNT: ${{ inputs.interested_count }}
      - run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git add events-data/events-manifest.json
          if [ -n "$EVENT_ID" ]; then
            git commit -m "chore: edit event $EVENT_ID"
          else
            git commit -m "chore: add/update event $EVENT_NAME ($EVENT_START_DATE)"
          fi
          git push
        env:
          EVENT_ID: ${{ inputs.event_id }}
          EVENT_NAME: ${{ inputs.name }}
          EVENT_START_DATE: ${{ inputs.start_date }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
