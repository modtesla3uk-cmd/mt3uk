name: Add, Update, or Delete Event

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Event name'
        required: true
      delete:
        description: 'Check to delete this event instead of adding/updating it'
        required: false
        type: boolean
        default: false
      description:
        description: 'Short description'
        required: false
      start_date:
        description: 'Start date (DD-MM-YYYY)'
        required: true
      start_time:
        description: 'Start time, 24h (HH:MM). Not needed when deleting.'
        required: false
      end_date:
        description: 'End date (DD-MM-YYYY), leave blank to match start date'
        required: false
      end_time:
        description: 'End time, 24h (HH:MM). Leave blank to match start time.'
        required: false
      location:
        description: 'Location name. Not needed when deleting.'
        required: false
      facebook_url:
        description: 'Facebook event URL. Not needed when deleting.'
        required: false
      attending_count:
        description: 'Attending count'
        required: false
        default: '0'
      interested_count:
        description: 'Interested count'
        required: false
        default: '0'

jobs:
  add-event:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: node scripts/add-event.js
        env:
          EVENT_DELETE: ${{ inputs.delete }}
          EVENT_NAME: ${{ inputs.name }}
          EVENT_DESCRIPTION: ${{ inputs.description }}
          EVENT_START_DATE: ${{ inputs.start_date }}
          EVENT_START_TIME: ${{ inputs.start_time }}
          EVENT_END_DATE: ${{ inputs.end_date }}
          EVENT_END_TIME: ${{ inputs.end_time }}
          EVENT_LOCATION: ${{ inputs.location }}
          EVENT_FACEBOOK_URL: ${{ inputs.facebook_url }}
          EVENT_ATTENDING_COUNT: ${{ inputs.attending_count }}
          EVENT_INTERESTED_COUNT: ${{ inputs.interested_count }}
      - run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git add events-data/events-manifest.json
          if [ "${{ inputs.delete }}" = "true" ]; then
            MSG="chore: delete event ${{ inputs.name }} (${{ inputs.start_date }})"
          else
            MSG="chore: add/update event ${{ inputs.name }} (${{ inputs.start_date }})"
          fi
          git commit -m "$MSG"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
