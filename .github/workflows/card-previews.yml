name: Homepage card share pages and previews

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "js/home-share.js"
      - "js/home-layout.js"
      - "js/shop-home-cards.js"
      - "scripts/build_card_shares.py"
  workflow_dispatch: {}
  # Every morning: the offer, the next interview and the Shop card change with the dates and the admin.
  schedule:
    - cron: "40 5 * * *"

permissions:
  contents: write

jobs:
  previews:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Playwright and Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Render the homepage cards and write their share pages
        run: python3 scripts/build_card_shares.py

      - name: Commit card previews
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add share/card
          if ! git diff --cached --quiet; then
            git commit -m "Update homepage card share pages and previews"
            for i in 1 2 3 4 5; do
              git push && break
              echo "Push rejected, rebasing onto latest main (attempt $i)..."
              git fetch origin main
              git rebase origin/main
              sleep $((RANDOM % 5 + 1))
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge Cloudflare cache for mt3uk.com
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl --fail -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
