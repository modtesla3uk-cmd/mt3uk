name: Delete Vote

on:
  workflow_dispatch:
    inputs:
      file:
        description: Gallery filename to clear today's votes for
        required: true

jobs:
  delete-vote:
    runs-on: ubuntu-latest
    steps:
      - run: |
          response=$(curl -s -X DELETE "https://late-darkness-ebc8.modtesla3uk.workers.dev/votes/all?key=$ADMIN_KEY&file=$FILE")

          if [ "$(echo "$response" | jq -r '.success')" != "true" ]; then
            echo "$response" | jq -r '.message // "Unknown error"' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Deleted votes for **$(echo "$response" | jq -r '.deleted')** on $(echo "$response" | jq -r '.date')" >> "$GITHUB_STEP_SUMMARY"
        env:
          ADMIN_KEY: ${{ secrets.VOTE_ADMIN_KEY }}
          FILE: ${{ inputs.file }}
