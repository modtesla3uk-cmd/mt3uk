# Clears Cloudflare's cache for mt3uk.com after each push to main. The site itself is served by Cloudflare from the
# repository (wrangler.jsonc), not by GitHub Pages, so this workflow no longer builds or deploys anything. GitHub Pages
# is switched off when the repository is private on the free plan, which made the old Pages deploy fail.
name: Purge the Cloudflare cache

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cloudflare-cache
  cancel-in-progress: true

jobs:
  purge-cloudflare-cache:
    runs-on: ubuntu-latest
    steps:
      # Cloudflare takes a minute or two to put a push live, so the purge waits for it.
      - name: Wait for the push to go live
        run: sleep 120

      - name: Purge Cloudflare cache for mt3uk.com
        run: |
          curl --fail -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
