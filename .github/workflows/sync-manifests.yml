name: Sync gallery and track days manifests

on:
  push:
    branches: [main]
    paths:
      - "images/gallery/**"
      - "images/track-days/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate gallery manifest from images/gallery/
        run: python3 scripts/build_gallery_manifest.py

      - name: Regenerate track days manifest from images/track-days/
        run: python3 scripts/build_track_days_manifest.py

      - name: Commit manifest and renamed photo changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/gallery/ images/track-days/
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate gallery and track days manifests"
            git push
          fi
