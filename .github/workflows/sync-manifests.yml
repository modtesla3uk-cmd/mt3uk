name: Sync gallery and track days manifests

on:
  push:
    branches: [main]
    paths:
      - "images/site/**"
      - "*.html"
  repository_dispatch:
    types: [gallery-submission]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow and boto3
        run: pip install Pillow boto3

      - name: Compress oversized gallery and track days photos in R2
        run: python3 scripts/compress_r2_images.py

      - name: Regenerate gallery manifest from R2
        run: python3 scripts/build_gallery_manifest.py

      - name: Regenerate track days manifest from R2
        run: python3 scripts/build_track_days_manifest.py

      - name: Regenerate sitemap.xml
        run: python3 generate_sitemap.py

      - name: Commit manifest changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/gallery/manifest.json images/track-days/manifest.json sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate gallery and track days manifests, and sitemap"
            for i in 1 2 3 4 5; do
              git push && break
              echo "Push rejected, rebasing onto latest main (attempt $i)..."
              git fetch origin main
              git rebase origin/main
              sleep $((RANDOM % 5 + 1))
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge Cloudflare cache for mt3uk.com
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl --fail -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
