name: Run Playwright tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      # Chromium for Android and desktop Chrome, WebKit for iPhone and iPad
      # (Safari's engine), Firefox for desktop Firefox. See tests/test_devices.py.
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium webkit firefox

      - name: Run tests
        run: pytest -v

      - name: Save device screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-screenshots
          path: test-results/devices/
          retention-days: 14
          if-no-files-found: ignore
