name: Run Playwright tests
run-name: "${{ github.event_name == 'repository_dispatch' && format('On-demand checks: {0}', github.event.client_payload.label) || github.event.head_commit.message || github.event.pull_request.title }}"

on:
  push:
  pull_request:
  # Started from the Device Checks page (device-checklist.html) through the
  # worker's /admin/run-tests, with a choice of devices, checks and pages.
  repository_dispatch:
    types: [device-tests]

# One job per device, so each shows its own pass or fail. The Device Checks
# page reads these job results and their failure notes from the GitHub API.
#
# A push that only changes content (an event or interview saved from the admin
# pages, a review, the regenerated manifests and share pages) runs the Site
# checks job alone: it is the one that reads those files, and the five device
# jobs would only repeat the page checks. Any code, page, test or workflow
# change still runs everything.
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      checks: ${{ steps.plan.outputs.checks }}
      pages: ${{ steps.plan.outputs.pages }}
    steps:
      - name: Choose devices and checks
        id: plan
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          EVENT_NAME: ${{ github.event_name }}
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          python3 - <<'PY'
          import json, os
          # Files the admin pages and the sync workflow commit on their own.
          CONTENT = (
              "data/event-pages.json", "data/interviews.json", "data/featured.json", "data/reviews.json",
              "events-data/events-manifest.json", "images/gallery/manifest.json", "images/track-days/manifest.json",
              "sitemap.xml", "images/reviews/", "share/",
          )
          def content_only():
              if os.environ.get("EVENT_NAME") != "push":
                  return False
              try:
                  commits = json.loads(os.environ.get("COMMITS") or "null") or []
              except ValueError:
                  return False
              changed = set()
              for c in commits:
                  for key in ("added", "modified", "removed"):
                      changed.update(c.get(key) or [])
              return bool(changed) and all(any(f == p or (p.endswith("/") and f.startswith(p)) for p in CONTENT) for f in changed)
          all_jobs = [
              {"name": "Site checks", "device": "", "browser": "chromium", "key": "site"},
              {"name": "iPhone", "device": "iphone", "browser": "webkit", "key": "iphone"},
              {"name": "iPad", "device": "ipad", "browser": "webkit", "key": "ipad"},
              {"name": "Android", "device": "android", "browser": "chromium", "key": "android"},
              {"name": "Desktop Chrome", "device": "desktop-chrome", "browser": "chromium", "key": "desktop-chrome"},
              {"name": "Desktop Firefox", "device": "desktop-firefox", "browser": "firefox", "key": "desktop-firefox"},
          ]
          tests = {
              "pages": "test_page_loads_fits_and_menu_opens",
              "likes": "test_reel_like_asks_to_sign_in_then_works",
              "gallery": "test_gallery_photo_opens_in_viewer",
              "garage": "test_my_garage_sign_in_with_code",
          }
          try:
              payload = json.loads(os.environ.get("PAYLOAD") or "null") or {}
          except ValueError:
              payload = {}
          devices = [d for d in payload.get("devices") or [] if isinstance(d, str)]
          checks = [c for c in payload.get("checks") or [] if c in tests]
          pages = [p for p in payload.get("pages") or [] if isinstance(p, str) and p.replace("-", "").isalnum()]
          jobs = [j for j in all_jobs if not devices or j["key"] in devices] or all_jobs
          if content_only():
              print("Only content changed: running the Site checks alone")
              jobs = [j for j in all_jobs if j["key"] == "site"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps({"include": jobs}) + "\n")
              out.write("checks=" + " or ".join(tests[c] for c in checks) + "\n")
              out.write("pages=" + ",".join(pages) + "\n")
          PY

  test:
    needs: plan
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      # Chromium for Android and desktop Chrome, WebKit for iPhone and iPad
      # (Safari's engine), Firefox for desktop Firefox. See tests/test_devices.py.
      - name: Install Playwright browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests
        env:
          MT3UK_DEVICES: ${{ matrix.device }}
          MT3UK_PAGES: ${{ needs.plan.outputs.pages }}
          CHECKS: ${{ needs.plan.outputs.checks }}
        run: |
          if [ -n "$MT3UK_DEVICES" ]; then
            if [ -n "$CHECKS" ]; then
              pytest -v tests/test_devices.py -k "$CHECKS" --junitxml=results.xml
            else
              pytest -v tests/test_devices.py --junitxml=results.xml
            fi
          else
            pytest -v --ignore=tests/test_devices.py --junitxml=results.xml
          fi

      - name: Report failures
        if: always()
        run: python scripts/ci/report_tests.py results.xml "${{ matrix.name }}"

      - name: Save device screenshots
        if: always() && matrix.device != ''
        uses: actions/upload-artifact@v4
        with:
          name: device-screenshots-${{ matrix.device }}
          path: test-results/devices/
          retention-days: 14
          if-no-files-found: ignore
