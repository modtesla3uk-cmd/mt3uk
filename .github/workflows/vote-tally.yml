name: Vote Tally

permissions:
  issues: write

on:
  workflow_dispatch: {}

jobs:
  vote-tally:
    runs-on: ubuntu-latest
    steps:
      - run: |
          response=$(curl -s "https://late-darkness-ebc8.modtesla3uk.workers.dev/votes/all?key=$ADMIN_KEY")

          if [ "$(echo "$response" | jq -r '.success')" != "true" ]; then
            echo "$response" | jq -r '.message // "Unknown error"' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "## Vote Tally"
            echo "Date: $(echo "$response" | jq -r '.date')"
            echo ""
            echo "| Photo | Votes |"
            echo "|---|---|"
            echo "$response" | jq -r '.results[] | "| \(.file) | \(.votes) |"'
          } | tee votes.md >> "$GITHUB_STEP_SUMMARY"
        env:
          ADMIN_KEY: ${{ secrets.VOTE_ADMIN_KEY }}
      - run: |
          existing=$(gh issue list --search "Vote Tally in:title" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file votes.md
          else
            gh issue create --title "Vote Tally" --body-file votes.md
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
