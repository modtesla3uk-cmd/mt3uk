<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laps by MT3UK reel</title>
<style>html,body{margin:0;background:#14213d}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Laps by MT3UK: 20 second vertical reel (1080 x 1920). A made-up circuit, never a real track.
// draw(t) paints the frame at time t (seconds). The render script calls it for every frame.
const W = 1080, H = 1920;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
// Green and gold, the live site theme (data-theme="gold" in css/site-theme.css): jade ground, mist text, gold accent.
const NAVY = '#0d3b33', NAVY2 = '#145a4d', ORANGE = '#e0b44a', CREAM = '#f1f6f3', MUTED = '#b5c9c1', BLUE = '#6fd1b0', ON_ACCENT = '#06201c';
const FONT = '"Liberation Sans", "Helvetica Neue", Arial, sans-serif';
const KMH_TO_MPH = 0.621371;
const VMIN = 65, VMAX = 170;                     // km/h, slowest corner to top speed
const TRACK = { x0: 90, x1: 990, y0: 830, y1: 1400 };
// A made-up club circuit, as control points in a 1000 x 700 box.
const CTRL = [[60,400],[120,170],[330,80],[520,150],[470,300],[640,320],[860,170],[950,360],[820,560],[600,600],[520,470],[330,640],[150,600],[40,510]];

const clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, j) => Math.round(v + (B[j] - v) * k)).join(',') + ')'; };
function speedColour(v) {
  const k = clamp((v - VMIN) / (VMAX - VMIN));
  return k < 0.5 ? mix(ORANGE, CREAM, k * 2) : mix(CREAM, BLUE, (k - 0.5) * 2);
}
function fmtLap(s) {
  const m = Math.floor(s / 60), r = s - m * 60;
  return m + ':' + r.toFixed(2).padStart(5, '0');
}

// ---- The circuit: a closed Catmull-Rom loop, fitted to the track box, with lengths and a speed profile ----
function cr(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return [0, 1].map(k => 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3));
}
const PER = 100, n = CTRL.length;
const raw = [];
for (let i = 0; i < n; i++) {
  const p0 = CTRL[(i - 1 + n) % n], p1 = CTRL[i], p2 = CTRL[(i + 1) % n], p3 = CTRL[(i + 2) % n];
  for (let k = 0; k < PER; k++) raw.push(cr(p0, p1, p2, p3, k / PER));
}
const N = raw.length;
let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
raw.forEach(([x, y]) => { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); });
const fit = Math.min((TRACK.x1 - TRACK.x0) / (maxX - minX), (TRACK.y1 - TRACK.y0) / (maxY - minY));
const cxr = (minX + maxX) / 2, cyr = (minY + maxY) / 2, ox = (TRACK.x0 + TRACK.x1) / 2, oy = (TRACK.y0 + TRACK.y1) / 2;
const P = raw.map(([x, y]) => [ox + (x - cxr) * fit, oy + (y - cyr) * fit]);
const segPx = P.map((p, i) => { const q = P[(i + 1) % N]; return Math.hypot(q[0] - p[0], q[1] - p[1]); });
const MPP = 2100 / segPx.reduce((a, b) => a + b, 0);       // the made-up club circuit is 2.1 km
const dsM = segPx.map(d => d * MPP);
const th = P.map((p, i) => { const q = P[(i + 1) % N]; return Math.atan2(q[1] - p[1], q[0] - p[0]); });
function smooth(arr, w) {
  return arr.map((_, i) => { let s = 0; for (let k = -w; k <= w; k++) s += arr[(i + k + N) % N]; return s / (2 * w + 1); });
}
const kap = th.map((a, i) => {
  let d = th[(i + 1) % N] - a;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  return Math.abs(d) / dsM[i];
});
const kapS = smooth(kap, 6);
const sortedK = kapS.slice().sort((a, b) => a - b);
const KMAX = sortedK[Math.floor(sortedK.length * 0.85)];
const vS = smooth(kapS.map(k => VMIN + (VMAX - VMIN) * (1 - Math.min(1, k / KMAX))), 12);
const tau = new Float64Array(N + 1);
for (let i = 0; i < N; i++) tau[i + 1] = tau[i] + dsM[i] / (vS[i] / 3.6);
const T = tau[N];                                           // the lap time of the car at speed factor 1
const TOP_MPH = Math.round(Math.max(...vS) * KMH_TO_MPH);

function idxAt(target) {
  let lo = 0, hi = N;
  while (lo < hi) { const m = (lo + hi) >> 1; if (tau[m] < target) lo = m + 1; else hi = m; }
  return clamp(lo - 1, 0, N - 1);
}
// f is the fraction of the lap A has covered, g the speed factor (1 for A, a touch over 1 for a quicker car).
function idxFor(f, g) { return idxAt(clamp(f) * T * g); }
function mphAt(i, g) { return Math.round(vS[i] * g * KMH_TO_MPH); }

// ---- Drawing helpers ----
function text(str, x, y, size, col, o = {}) {
  ctx.save();
  ctx.globalAlpha *= o.alpha == null ? 1 : o.alpha;
  ctx.font = (o.weight || 700) + ' ' + size + 'px ' + FONT;
  ctx.fillStyle = col;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.base || 'alphabetic';
  if (o.spacing) ctx.letterSpacing = o.spacing + 'px';
  ctx.fillText(str, x, y);
  ctx.restore();
}
function pill(x, y, w, h, fill, stroke) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, h / 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
}
function measure(str, size, weight = 700) {
  ctx.font = weight + ' ' + size + 'px ' + FONT;
  return ctx.measureText(str).width;
}
// The lap timer mark (images/laps/laps-mark.svg), redrawn in cream and orange on the navy background.
// sweep (0 to 1) is how far the orange arc has run round.
function drawMark(cx, cy, size, sweep, alpha = 1) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(cx - size / 2, cy - size / 2);
  ctx.scale(size / 64, size / 64);
  ctx.fillStyle = CREAM;
  ctx.beginPath(); ctx.roundRect(27, 3, 10, 6, 2); ctx.fill();
  ctx.lineCap = 'round';
  ctx.strokeStyle = CREAM; ctx.globalAlpha *= 0.22; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.arc(32, 36, 21, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha /= 0.22;
  if (sweep > 0) {
    ctx.strokeStyle = ORANGE; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.arc(32, 36, 21, -Math.PI / 2, -Math.PI / 2 + 1.5 * Math.PI * clamp(sweep)); ctx.stroke();
  }
  ctx.strokeStyle = CREAM; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(32, 36); ctx.lineTo(43, 25); ctx.stroke();
  ctx.fillStyle = CREAM;
  ctx.beginPath(); ctx.arc(32, 36, 3.4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawGhost(alpha) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = CREAM; ctx.lineWidth = 16; ctx.lineJoin = 'round';
  ctx.beginPath();
  P.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.closePath(); ctx.stroke();
  ctx.restore();
}
// Draws the lap trail up to index i, each piece coloured by the speed it was driven at.
function drawTrail(i, g, alpha) {
  if (i < 1 || alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.lineCap = 'round'; ctx.lineWidth = 16;
  for (let j = 0; j < i; j++) {
    ctx.strokeStyle = speedColour(vS[j] * g);
    ctx.beginPath(); ctx.moveTo(P[j][0], P[j][1]); ctx.lineTo(P[j + 1][0], P[j + 1][1]); ctx.stroke();
  }
  ctx.restore();
}
function drawStart() {
  const [x, y] = P[0], a = th[0] + Math.PI / 2, r = 46;
  ctx.save();
  ctx.strokeStyle = CREAM; ctx.lineWidth = 8; ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r); ctx.lineTo(x - Math.cos(a) * r, y - Math.sin(a) * r); ctx.stroke();
  ctx.restore();
}
function drawCar(i, colour, alpha = 1) {
  const [x, y] = P[i];
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.strokeStyle = NAVY; ctx.lineWidth = 20;
  ctx.beginPath(); ctx.arc(x, y, 26, 0, Math.PI * 2); ctx.stroke();
  ctx.shadowColor = colour; ctx.shadowBlur = 40;
  ctx.fillStyle = colour;
  ctx.beginPath(); ctx.arc(x, y, 26, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = CREAM; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.arc(x, y, 26, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}
// A headline: the last full stop is drawn in orange.
function headline(str, y, alpha, slide) {
  const size = 150, spacing = -3;
  const dot = str.endsWith('.');
  const body = dot ? str.slice(0, -1) : str;
  ctx.save();
  ctx.font = '700 ' + size + 'px ' + FONT;
  ctx.letterSpacing = spacing + 'px';
  const wBody = ctx.measureText(body).width, wDot = dot ? ctx.measureText('.').width : 0;
  const x0 = 540 - (wBody + wDot) / 2;
  text(body, x0, y + slide, size, CREAM, { align: 'left', alpha, spacing });
  if (dot) text('.', x0 + wBody, y + slide, size, ORANGE, { align: 'left', alpha, spacing });
  ctx.restore();
}

// ---- The scenes ----
const SC = [
  { a: 0, b: 2.4, head: ['Every lap.'], cap: [] },
  { a: 2.4, b: 6.4, head: ['Mapped.'], cap: ['Drop in the file from your lap timer.', 'Colour shows your speed, corner by corner.'],
    laps: [{ start: 2.6, D: 3.6, g: 1, trail: true }] },
  { a: 6.4, b: 9.6, head: ['Measured.'], cap: ['Every point of the lap, from your own file.'],
    laps: [{ start: 6.6, D: 2.8, g: 1, trail: true }] },
  { a: 9.6, b: 13.4, head: ['Compared.'], cap: ['Play two laps together', 'and see where the time went.'],
    laps: [{ start: 9.9, D: 3.2, g: 1, trail: true, label: 'A' }, { start: 9.9, D: 3.2, g: 1.02, trail: false, label: 'B' }] },
  { a: 13.4, b: 16.6, head: ['Any EV.', 'Any make.'], cap: ['Works with your lap timer.'], chips: true },
  { a: 16.6, b: 20, end: true }
];
// Each slide holds for a second once it is complete, before it goes, so there is time to read it. The slides keep their own
// timing (a, b); the reel's timeline runs slide after slide, with the pause on the end of each one but the end card.
const PAUSE = 1;
let slideStart = 0;
SC.forEach(sc => { sc.start = slideStart; sc.len = (sc.b - sc.a) + (sc.end ? 0 : PAUSE); slideStart += sc.len; });
const REEL_LENGTH = slideStart;
const GAP = T * (1 - 1 / 1.02);                           // seconds B is quicker over the lap

function drawLapScene(s, t, left) {
  const trailAlpha = clamp(left / 0.3);
  drawGhost(0.16 * clamp((t - s.a) / 0.5) * trailAlpha);
  drawStart();
  s.laps.forEach(l => {
    if (t < l.start) return;
    const f = (t - l.start) / l.D;
    const i = idxFor(clamp(f), l.g);
    if (l.trail) drawTrail(i, l.g, trailAlpha);
    if (f < 1) drawCar(i, l.g === 1 ? ORANGE : BLUE);
  });
}

function drawStats(s, t) {
  const lt = t - s.a;
  if (s.laps.length === 1 && s.head[0] === 'Mapped.') {
    const l = s.laps[0];
    const f = clamp((t - l.start) / l.D), i = idxFor(f, 1);
    text(String(mphAt(i, 1)), 90, 1560, 128, CREAM, { align: 'left' });
    text('mph', 90 + measure(String(mphAt(i, 1)), 128) + 16, 1560, 48, MUTED, { align: 'left', weight: 600 });
    const done = clamp((t - (l.start + l.D)) / 0.3);
    if (done > 0) {
      pill(990 - 430, 1466, 430, 100, NAVY2);
      text('Lap 1  ' + fmtLap(T), 990 - 215, 1532, 52, CREAM, { alpha: done });
    }
  }
  if (s.head[0] === 'Measured.') {
    const l = s.laps[0];
    const f = clamp((t - l.start) / l.D), i = idxFor(f, 1);
    text(String(mphAt(i, 1)), 90, 1560, 128, CREAM, { align: 'left' });
    text('mph', 90 + measure(String(mphAt(i, 1)), 128) + 16, 1560, 48, MUTED, { align: 'left', weight: 600 });
    const a = clamp(lt / 0.3);
    pill(990 - 300, 1466, 300, 100, NAVY2);
    text('Top ' + TOP_MPH + ' mph', 990 - 150, 1532, 48, CREAM, { alpha: a });
  }
  if (s.head[0] === 'Compared.') {
    const [la, lb] = s.laps;
    const ia = idxFor(clamp((t - la.start) / la.D), 1), ib = idxFor(clamp((t - lb.start) / lb.D), lb.g);
    text('A ' + mphAt(ia, 1) + ' mph', 90, 1560, 72, ORANGE, { align: 'left' });
    text('B ' + mphAt(ib, lb.g) + ' mph', 990, 1560, 72, BLUE, { align: 'right' });
    const done = clamp((t - (lb.start + lb.D / lb.g)) / 0.4);
    if (done > 0) text('B ' + GAP.toFixed(2) + ' s faster', 540, 1622, 56, CREAM, { alpha: done });
  }
}

function drawChips(s, t) {
  const lt = t - s.a;
  const row = (items, y, pops) => {
    const gap = 30, pad = 52, h = 128;
    const ws = items.map(([label, size, weight]) => measure(label, size, weight) + pad * 2);
    let x = 540 - (ws.reduce((a, b) => a + b, 0) + gap * (ws.length - 1)) / 2;
    items.forEach(([label, size, weight, outline], k) => {
      const p = easeOut(clamp((lt - pops[k]) / 0.45));
      const w = ws[k], sc = 0.7 + 0.3 * p;
      ctx.save();
      ctx.globalAlpha = p;
      ctx.translate(x + w / 2, y + h / 2); ctx.scale(sc, sc); ctx.translate(-(x + w / 2), -(y + h / 2));
      if (outline) pill(x, y, w, h, null, 'rgba(244,241,234,0.35)');
      else pill(x, y, w, h, NAVY2, 'rgba(244,241,234,0.22)');
      text(label, x + w / 2, y + h / 2 + size * 0.36, size, outline ? MUTED : CREAM, { weight });
      ctx.restore();
      x += w + gap;
    });
  };
  row([['Tesla', 64, 700], ['Hyundai', 64, 700]], 880, [0.3, 0.52]);
  row([['Kia', 64, 700], ['Porsche', 64, 700]], 1040, [0.74, 0.96]);
  row([['and more', 56, 600, true]], 1200, [1.18]);
}

function drawEnd(lt) {
  const mA = clamp(lt / 0.6);
  drawMark(540, 560, 240, clamp(lt / 0.9), mA);
  text('Laps by MT3UK', 540, 880, 118, CREAM, { alpha: clamp((lt - 0.4) / 0.6), spacing: -2 });
  text('Every lap, mapped and measured.', 540, 962, 56, MUTED, { alpha: clamp((lt - 1.0) / 0.5), weight: 600 });
  text('laps.mt3uk.com', 540, 1110, 72, ORANGE, { alpha: clamp((lt - 1.5) / 0.5) });
}

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = NAVY;
  ctx.fillRect(0, 0, W, H);
  // A faint lap ring behind everything, so the frame has depth without clutter.
  ctx.save();
  ctx.strokeStyle = 'rgba(244,241,234,0.045)'; ctx.lineWidth = 120;
  ctx.beginPath(); ctx.arc(540, 1115, 760, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();

  const s = SC.find(sc => t >= sc.start && t < sc.start + sc.len) || SC[SC.length - 1];
  const lt = t - s.start;                              // time into this slide, pause included
  const left = s.len - lt;                             // time left before the next slide
  if (s.end) { drawEnd(lt); return; }
  // The slide's own content (its laps, timers and chips) holds still once it is complete, through the pause
  const at = s.a + Math.min(lt, s.b - s.a);
  const inA = clamp(lt / 0.4), outA = clamp(left / 0.25);
  const a = Math.min(inA, outA), slide = (1 - easeOut(inA)) * 28;

  if (s.head[0] === 'Every lap.') {
    drawMark(540, 330, 190, clamp(lt / 1.0), clamp(lt / 0.3));
    drawGhost(0.16 * clamp((at - 1.2) / 1.2));
    headline('Every lap.', 520, clamp(lt / 0.5), (1 - easeOut(clamp(lt / 0.5))) * 28);
    return;
  }
  if (s.chips) {
    s.head.forEach((line, k) => headline(line, 400 + k * 160, Math.min(clamp((lt - k * 0.12) / 0.4), outA), (1 - easeOut(clamp((lt - k * 0.12) / 0.4))) * 28));
    s.cap.forEach((line, k) => text(line, 540, 690 + k * 52, 50, CREAM, { alpha: a, weight: 400 }));
    drawChips(s, at);
    return;
  }
  // Headline (one or two lines), then the caption.
  if (s.head.length === 1) headline(s.head[0], 520, a, slide);
  else s.head.forEach((line, k) => headline(line, 400 + k * 160, a, slide));
  s.cap.forEach((line, k) => text(line, 540, 640 + k * 52, 50, CREAM, { alpha: a, weight: 400 }));
  drawLapScene(s, at, left);
  drawStats(s, at);
}

window.draw = draw;
window.reelInfo = { T: T.toFixed(2), TOP_MPH, GAP: GAP.toFixed(3), N, KMAX, LENGTH: REEL_LENGTH };
window.ready = document.fonts.ready.then(() => true);
draw(0);
</script>
</body>
</html>
