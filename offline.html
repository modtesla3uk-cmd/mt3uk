<!DOCTYPE html>
<html lang="en">
<head><link rel="stylesheet" href="css/site-theme.css?v=2"><script src="js/site-theme.js?v=1"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're offline – MT3UK</title>
<link rel="icon" type="image/x-icon" href="images/site/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="images/site/apple-touch-icon.png">
<meta name="theme-color" content="#16233d">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@700;800&family=IBM+Plex+Sans:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--c-paper, #f3f1ea);
    color: var(--ink, #16233d);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 28px;
  }
  .offline-wrap { max-width: 420px; }
  .mono {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.83rem;
    color: var(--orange-text, color-mix(in srgb, var(--orange, #e8542a) 70%, #000));
    display: block;
    margin-bottom: 12px;
  }
  h1 {
    font-family: 'Archivo Expanded', sans-serif;
    font-weight: 800;
    font-size: 1.8rem;
    margin-bottom: 12px;
  }
  p { color: var(--c-slate, #4a6491); line-height: 1.55; margin-bottom: 24px; }
  button {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    background: var(--ink, #16233d);
    color: var(--c-paper, #f3f1ea);
    border: 1px solid var(--ink, #16233d);
    padding: 12px 24px;
    cursor: pointer;
  }
  button:hover { background: var(--orange, #e8542a); border-color: var(--orange, #e8542a); }
</style>
</head>
<body>
  <div class="offline-wrap">
    <span class="mono">No connection</span>
    <h1>You're offline</h1>
    <p>MT3UK couldn't load this page. Check your connection and try again, anything you've already visited may still be available.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
