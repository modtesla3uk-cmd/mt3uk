<style>
/* Laps pages with the bottom bar (Sessions, Leaderboard, Favourites, My Analysis): the header keeps the bell and the menu,
   the four sections move to the bar, which can also be swiped between on a phone. Other Laps-header pages are unchanged. */
.laps-tabs { display: none; }
@media (max-width: 780px), (orientation: landscape) and (max-height: 500px) {
  header.laps-tabbed .nav-sessions, header.laps-tabbed .nav-leaders, header.laps-tabbed .nav-favs, header.laps-tabbed .nav-analysis, header.laps-tabbed .nav-home { display: none !important; }
  body.laps-tabbed .laps-tabs { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 49; height: 66px; padding: 4px 6px calc(4px + env(safe-area-inset-bottom, 0px)); background: #ffffff; border-top: 1px solid var(--hairline, #d9d9d9); justify-content: space-around; align-items: stretch; }
  body.laps-tabbed { padding-bottom: calc(74px + env(safe-area-inset-bottom, 0px)); }
  /* The page is at least a full screen tall, so the footer stays at the bottom while a short page loads, not in the middle. */
  body.laps-tabbed { box-sizing: border-box; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  body.laps-tabbed > footer { margin-top: auto; }
  .laps-tabs a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 44px; border-radius: 10px; color: var(--ink, #111); text-decoration: none; font: 600 11px/1.1 var(--font-body, sans-serif); }
  .laps-tabs a svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .laps-tabs a.on { color: var(--orange, #e8542a); font-weight: 700; }
  .laps-tabs a.on svg { stroke-width: 2.4; }
  /* Add a session is the same on every page: full width, 40 px tall, centred, on a phone. */
  body.laps-tabbed #tp-hero-add, body.laps-tabbed #lb-add-session, body.laps-tabbed .tm-pill-accent { grid-column: 1 / -1 !important; justify-self: stretch !important; width: 100% !important; box-sizing: border-box; min-height: 40px !important; height: 40px !important; padding: 0 16px !important; font-size: 0.95rem !important; justify-content: center !important; }
  /* The bottom bar and the swipe do these jobs, so the Back buttons and the matching buttons in each page heading go on a phone. */
  body.laps-tabbed [data-btn="my-analysis"], body.laps-tabbed [data-btn="leaderboards"], body.laps-tabbed [data-btn="sessions"],
  body.laps-tabbed #lb-my-analysis, body.laps-tabbed #lb-my-sessions, body.laps-tabbed #tp-analysis-pill, body.laps-tabbed #tp-lb-pill,
  body.laps-tabbed .lh-hero a[href="leaderboards.html"], body.laps-tabbed .back-link { display: none !important; }
  /* The line over the bar shows the section you are on, and slides as you swipe. */
  .laps-ind { position: absolute; top: 0; left: 6px; height: 3px; width: calc((100% - 12px) / 4); background: var(--orange, #e8542a); border-radius: 2px; transition: transform .25s ease; pointer-events: none; }
  /* While a swipe is dragged, the next section waits under the page and shows its name. */
  .laps-peek { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; background: var(--paper, #f4f1ea); color: var(--ink, #111); font: 700 1.6rem/1.2 var(--font-head, sans-serif); text-align: center; padding: 24px; }
  .laps-peek small { display: block; font: 600 0.9rem/1.4 var(--font-body, sans-serif); color: var(--steel, #555); margin-top: 8px; }
  body.laps-swiping header ~ *:not(.laps-peek):not(.laps-tabs):not(script) { position: relative; z-index: 41; }
}
/* The bar is black with white words where the page is dark (Laps in dark mode, RaceBox and Navigate). */
html[data-mode="dark"] .laps-tabs { background: #000000 !important; border-top-color: #ffffff !important; }
html[data-mode="dark"] .laps-tabs a { color: #ffffff !important; }
html[data-mode="dark"] .laps-tabs a.on { color: #f5c542 !important; }
html[data-mode="dark"] .laps-ind { background: #f5c542 !important; }
html[data-mode="dark"] .laps-peek { background: #000000; color: #ffffff; }
</style>

<script>
// In the Laps app, set the phone's status bar icons (clock, battery) to suit the header colour: dark on the light header.
// Does nothing in a normal browser.
(function () {
  var sb = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SystemBars;
  if (!sb || !sb.setStyle) return;
  var hdr = document.querySelector('header');
  var m = hdr ? getComputedStyle(hdr).backgroundColor.match(/[\d.]+/g) : null;
  var light = !m || (m[0] * 299 + m[1] * 587 + m[2] * 114) / 1000 > 140;
  sb.setStyle({ style: light ? 'LIGHT' : 'DARK', bar: 'StatusBar' }).catch(function () {});
})();

<script>
// Laps pages with the bottom bar. The current section is marked and a line over the bar shows it. On a phone a swipe
// left or right moves the whole page (the heading, the content and the footer) with your finger, with the next page's
// name waiting under it, and opens that page when you lift your finger past halfway (or with a quick flick). The
// intro (laps.html) is the first page in the swipe. RaceBox and Navigate get the bar but not the swipe.
(function () {
  var header = document.querySelector('header');
  var page = location.pathname.split('/').pop() || 'laps.html';
  var TABBED = ['laps.html', 'track.html', 'leaderboards.html', 'favourites.html', 'my-analysis.html', 'racebox.html', 'navigate.html'];
  var SWIPE = ['laps.html', 'track.html', 'leaderboards.html', 'favourites.html', 'my-analysis.html'];
  var NAMES = { 'laps.html': 'Laps', 'track.html': 'Sessions', 'leaderboards.html': 'Leaderboard', 'favourites.html': 'Favourites', 'my-analysis.html': 'My Analysis' };
  if (!header || TABBED.indexOf(page) < 0) return;
  header.classList.add('laps-tabbed');
  document.body.classList.add('laps-tabbed');
  var here = SWIPE.indexOf(page), ind = null, peek = null, parts = [], dragging = false;
  // The line sits over the four sections of the bar; the intro is before them, so it has no line.
  function barPos(i) { return i - 1; }
  document.addEventListener('DOMContentLoaded', function () {
    var bar = document.querySelector('.laps-tabs');
    if (!bar) return;
    bar.querySelectorAll('a').forEach(function (a) { if (a.getAttribute('data-tab') === page) a.classList.add('on'); });
    ind = document.createElement('span'); ind.className = 'laps-ind';
    if (barPos(here) < 0) ind.style.display = 'none';
    ind.style.transform = 'translateX(' + (Math.max(0, barPos(here)) * 100) + '%)';
    bar.appendChild(ind);
  });
  var phone = window.matchMedia('(max-width: 780px), (orientation: landscape) and (max-height: 500px)');
  var sx = 0, sy = 0, st = 0, skip = false, drag = false, dx = 0;
  // Only real controls that need the finger (typing, sliders, maps, video, scrolling tables) keep their own gestures.
  var NO_SWIPE = 'input,select,textarea,video,canvas,[data-no-swipe],.laps-tabs,.navlinks,.nav-bell-panel,.nav-search-panel,.leaflet-container,.nav-body,.ma-scroll,.ma-table,.tp-chips,.lb-types';
  function scrolls(el) {
    for (var e = el; e && e !== document.body; e = e.parentElement) {
      if (e.scrollWidth > e.clientWidth + 2) { var o = getComputedStyle(e).overflowX; if (o === 'auto' || o === 'scroll') return true; }
    }
    return false;
  }
  function target(d) { if (here < 0) return -1; var j = d < 0 ? here + 1 : here - 1; return (j >= 0 && j < SWIPE.length) ? j : -1; }
  function setInd(pos, animate) { if (!ind || barPos(here) < 0) return; ind.style.transition = animate ? 'transform .25s ease' : 'none'; ind.style.transform = 'translateX(' + (Math.max(0, pos) * 100) + '%)'; }
  function ensure() {
    if (parts.length) return true;
    // Everything in the flow of the page moves together: the heading section, the content and the footer.
    parts = [].slice.call(document.body.children).filter(function (el) {
      if (/^(HEADER|SCRIPT|STYLE|TEMPLATE|LINK|NAV)$/.test(el.tagName)) return false;
      if (el.classList.contains('laps-peek') || el.classList.contains('laps-tabs')) return false;
      return getComputedStyle(el).position === 'static' && el.getBoundingClientRect().height > 0;
    });
    if (!parts.length) return false;
    peek = document.createElement('div'); peek.className = 'laps-peek'; peek.setAttribute('aria-hidden', 'true');
    document.body.appendChild(peek);
    return true;
  }
  function move(off, animate) {
    parts.forEach(function (el) {
      el.style.transition = animate ? 'transform .22s ease' : 'none';
      el.style.transform = off ? 'translate3d(' + off + 'px,0,0)' : '';
    });
  }
  function reset() {
    if (parts.length) move(0, true);
    if (peek) peek.style.display = 'none';
    document.body.classList.remove('laps-swiping');
    setInd(barPos(here), true);
    setTimeout(function () { if (!dragging) { parts.forEach(function (el) { el.style.transition = ''; el.style.transform = ''; }); parts = []; if (peek) { peek.remove(); peek = null; } } }, 240);
  }
  document.addEventListener('touchstart', function (e) {
    var t = e.touches[0];
    sx = t.clientX; sy = t.clientY; st = Date.now(); drag = false; dx = 0;
    skip = !phone.matches || !!(e.target.closest && e.target.closest(NO_SWIPE)) || scrolls(e.target);
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (skip || !e.touches.length) return;
    var t = e.touches[0], x = t.clientX - sx, y = t.clientY - sy;
    if (!drag) {
      if (Math.abs(x) < 10 && Math.abs(y) < 10) return;
      // A press held still before the move is a pick or a reorder on the page, not a swipe.
      if (Date.now() - st > 450) { skip = true; return; }
      if (Math.abs(y) > Math.abs(x)) { skip = true; return; }
      drag = true; dragging = true;
      if (!ensure()) { skip = true; return; }
      document.body.classList.add('laps-swiping');
    }
    dx = x;
    var n = target(dx), w = window.innerWidth;
    if (n >= 0) {
      peek.innerHTML = NAMES[SWIPE[n]] + '<small>Let go to open</small>';
      peek.style.display = 'flex';
      peek.style.transform = 'translate3d(' + (dx < 0 ? w + dx : -w + dx) + 'px,0,0)';
      move(dx, false);
      setInd(barPos(here) + (dx < 0 ? 1 : -1) * Math.min(1, Math.abs(dx) / w), false);
    } else {
      move(dx * 0.3, false);
    }
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (skip || !drag || !e.changedTouches.length) { drag = false; dragging = false; return; }
    drag = false;
    var w = window.innerWidth, n = target(dx), quick = Date.now() - st < 400 && Math.abs(dx) > 50;
    if (n >= 0 && (Math.abs(dx) > w * 0.5 || quick)) {
      var to = dx < 0 ? -w : w;
      parts.forEach(function (el) { el.style.transition = 'transform .22s ease'; el.style.transform = 'translate3d(' + to + 'px,0,0)'; });
      if (peek) peek.style.transform = 'translate3d(0,0,0)';
      setInd(barPos(n), true);
      dragging = false;
      setTimeout(function () { location.href = SWIPE[n]; }, 230);
    } else {
      dragging = false;
      reset();
    }
  }, { passive: true });
  document.addEventListener('touchcancel', function () { if (drag) { drag = false; dragging = false; reset(); } }, { passive: true });
})();
</script>
