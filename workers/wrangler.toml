name = "late-darkness-ebc8"
main = "vote-worker.js"
compatibility_date = "2026-09-07"

# ADMIN_KEY and GITHUB_TOKEN are managed directly in the Cloudflare dashboard
# (not declared here), so deploys must not clear them.
keep_vars = true

[[kv_namespaces]]
binding = "VOTES"
id = "e189cfa5369c48559c76c847b203e386"

[[r2_buckets]]
binding = "GALLERY_BUCKET"
bucket_name = "mt3uk-gallery"

# Requires Email Routing to be enabled for the mt3uk.com zone in the
# Cloudflare dashboard, with noreply@mt3uk.com set up as a sender.
[[send_email]]
name = "SEND_EMAIL"

[observability]
enabled = true

[triggers]
# Every 5 minutes, so the UK-midnight vote tally and UK-8pm subscribers
# digest checks in `scheduled()` get a tick close enough to their target
# time even if Cloudflare cron triggers fire a little late on this account.
crons = ["*/5 * * * *"]
